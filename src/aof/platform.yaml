# AOF platform configuration. Owned by the platform team, not app teams.
# Every app is checked against this file. Override with `aof --platform <file>`.
#
# The threshold numbers below are STARTING PLACEHOLDERS. The reference design does not
# fix them: calibrate them on the lighthouse wave, then version this file.
version: "0.1"

registry:
  namespace_prefix: "com.example"      # internal server names must start with this
  allowed_remote_types: ["streamable-http"]

budgets:                               # platform-wide ceilings; apps may only tighten
  max_steps_per_run: 25
  max_delegation_depth: 10             # mirrors Snowflake's 10-invocation recursion cap
  max_cost_usd_per_run: 2.0

identity:
  scope_ttl_seconds: 900               # short-lived, per-tool scopes
  token_exchange: "urn:ietf:params:oauth:grant-type:token-exchange"

telemetry:
  # OTel GenAI semantic conventions are still in Development status:
  # pin the version every agent, gateway and MCP server emits.
  genai_semconv_version: "PIN_ME"

tools:
  max_tools_per_server: 20             # fewer, better tools
  min_description_chars: 40
  max_description_chars: 1024

golden_set:
  min_cases: 50
  recommended_max: 200

eval_thresholds:                       # required at the evaluate gate, by app risk tier
  T1: {task_success: 0.80, tool_call_accuracy: 0.90, safety_pass_rate: 0.95}
  T2: {task_success: 0.85, tool_call_accuracy: 0.95, safety_pass_rate: 0.98}
  T3: {task_success: 0.90, tool_call_accuracy: 0.97, safety_pass_rate: 1.00}

pilot:                                 # shadow-mode gate, by app risk tier
  min_window_days: 14
  min_proposals: 100
  min_agreement_rate: {T1: 0.85, T2: 0.90, T3: 0.95}
  max_incidents: {T1: 2, T2: 1, T3: 0}

slos:                                  # defaults written into compiled policy
  demotion_window_hours: 24            # breach this long -> demote one autonomy level
  p95_latency_ms: 8000
  max_human_override_rate: 0.20
  max_policy_violations: 0
