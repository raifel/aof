# AOF platform configuration. Owned by the platform team, not app teams.
# Every app is checked against this file. Override with `aof --platform <file>`.
#
# The threshold numbers below are STARTING PLACEHOLDERS. The reference design does not
# fix them: calibrate them on the lighthouse wave, then version this file.
version: "0.1"

registry:
  namespace_prefix: "com.example"      # internal server names must start with this
  allowed_remote_types: ["streamable-http"]

budgets:                               # platform-wide ceilings; apps may only tighten
  max_steps_per_run: 25
  max_delegation_depth: 10             # mirrors Snowflake's 10-invocation recursion cap
  max_cost_usd_per_run: 2.0

identity:
  scope_ttl_seconds: 900               # short-lived, per-tool scopes
  token_exchange: "urn:ietf:params:oauth:grant-type:token-exchange"
  token_endpoint: null                 # the IdP's RFC 8693 token endpoint (https); set per deployment
  # Verifying callers' tokens (JWT access tokens signed by the IdP). Set per deployment.
  issuer: null                         # e.g. https://idp.example.com/realms/agents (https)
  jwks_uri: null                       # default: discovered from the issuer's metadata
  algorithms: [RS256, PS256, ES256, EdDSA]   # asymmetric only; HS* and none are refused
  roles_claim: roles                   # dotted path, e.g. realm_access.roles (Keycloak)
  tenant_claim: tenant
  leeway_seconds: 60                   # clock skew allowed on exp / nbf / iat
  operator_role: aof-operator          # may use the kill switch and demote via the admin API

telemetry:
  # OTel GenAI semantic conventions are still in Development status:
  # pin the version every agent, gateway and MCP server emits.
  genai_semconv_version: "PIN_ME"

tools:
  max_tools_per_server: 20             # fewer, better tools
  min_description_chars: 40
  max_description_chars: 1024

golden_set:
  min_cases: 50
  recommended_max: 200

eval_thresholds:                       # required at the evaluate gate, by app risk tier
  T1: {task_success: 0.80, tool_call_accuracy: 0.90, safety_pass_rate: 0.95}
  T2: {task_success: 0.85, tool_call_accuracy: 0.95, safety_pass_rate: 0.98}
  T3: {task_success: 0.90, tool_call_accuracy: 0.97, safety_pass_rate: 1.00}

pilot:                                 # shadow-mode gate, by app risk tier
  min_window_days: 14
  min_proposals: 100
  min_agreement_rate: {T1: 0.85, T2: 0.90, T3: 0.95}
  max_incidents: {T1: 2, T2: 1, T3: 0}

slos:                                  # defaults written into compiled policy
  demotion_window_hours: 24            # breach this long -> demote one autonomy level
  p95_latency_ms: 8000
  max_human_override_rate: 0.20
  max_policy_violations: 0

llm:                                   # model calls through the gateway (POST /v1/messages)
  provider: anthropic
  default_model: claude-opus-5-5
  allowed_models: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5, claude-fable-5-2]
  max_tokens_ceiling: 128000
  max_model_calls_per_run: 50
  allowed_betas: []                    # betas change behaviour (e.g. fallbacks to other models)
  allowed_server_tools: []             # e.g. web_search: brings untrusted content (ASI01)
  # USD per million tokens, Anthropic first-party list prices as of 2026-11.
  # Keep in sync with https://platform.claude.com/docs/en/about-claude/pricing
  # cache_read defaults to 0.1 x input when not listed. Long-context premiums are not modelled.
  pricing_usd_per_mtok:
    claude-fable-5-2:  {input: 8.00, output: 40.00, cache_read: 0.20}
    claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10}
    claude-haiku-5-5:  {input: 0.10, output: 0.50}
  cache_write_multiplier: 1.25         # 5-minute cache writes
  fast_mode_multiplier: 2.0

data_safety:                           # what data may reach the model (docs/data-safety.md)
  # enforce: vault governed results, the agent gets a handle and allowed values only
  # shadow: vault and audit, but return results unchanged (rollout); off: no vault.
  # Apps may only tighten (aof.yaml data_safety.results, AOF-P076).
  results: shadow
  default_mode: metadata_only          # metadata_only | contract; used when aof.yaml sets none
  metadata_only_from_tier: T3          # apps at this tier or above must use metadata_only
  default_exposure:                    # a field's llm_exposure when the contract sets none
    public: allowed
    internal: aggregate
    confidential: none
    restricted: none
  exposure_ceiling:                    # the most a field of this classification may be exposed
    public: allowed
    internal: aggregate
    confidential: token
    restricted: none
  min_group_size: 10                   # k: smallest group whose aggregate the model may see
  row_count_buckets: [0, 1, 10, 100, 1000, 10000]
  row_filter_claims: {}                # extra row-filter claims: name -> dotted token claim path
  provider:
    zero_data_retention: required      # required | recommended | not_required
  vault:                               # results of governed reads, kept from the model
    ttl_seconds: 3600
    max_bytes_per_result: 5000000
    model_preview_rows: 20             # visible (allowed or token) rows returned to the agent
    reader_clients: []                 # OAuth client ids (the app's UI) that may GET /results
  egress:                              # checks on POST /v1/messages before it leaves (D3)
    detectors:                         # block | redact (to a vault token) | off
      iban: redact
      card_number: block
      email: redact
      phone: redact
    custom_patterns: {}                # name: {regex: "...", action: block|redact}
    non_text: block                    # images and documents cannot be checked: block | allow
    fingerprints: true                 # block requests that carry values from vaulted results
    max_fingerprints_per_user: 20000
  query:                               # ceilings for query tools (tools.manifest `query:`)
    max_queries_per_run: 20
    max_rows_ceiling: 10000
    timeout_seconds_ceiling: 60
    max_bytes_scanned_ceiling: 50000000000
    allowed_functions: [
      SUM, COUNT, AVG, MIN, MAX, COUNT_IF,
      ABS, ROUND, FLOOR, CEIL, COALESCE, NULLIF, IFNULL, NVL, IF, IFF, CASE, CAST, TRY_CAST,
      DATE_TRUNC, TIMESTAMP_TRUNC, EXTRACT, YEAR, QUARTER, MONTH, DAY, DATE_PART, DATEADD,
      DATE_ADD, DATEDIFF, DATE_DIFF, TO_DATE, CURRENT_DATE, LAST_DAY,
      LOWER, UPPER, TRIM, CONCAT, SUBSTRING, SUBSTR, LEFT, RIGHT, LENGTH,
      ROW_NUMBER, RANK, DENSE_RANK, LAG, LEAD, FIRST_VALUE, LAST_VALUE,
    ]
