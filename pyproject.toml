[project]
name = "aof"
version = "0.1.0"
description = "Agentic Onboarding Framework (AOF): onboarding contract kit, policy compiler and CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
gateway = ["mcp>=2.0", "anthropic>=2.0", "httpx2>=2.0", "pyjwt[crypto]>=2.8", "redis>=5.0", "opentelemetry-api>=1.30", "uvicorn>=0.30"]
dev = ["pytest>=8", "a2a-sdk[http-server]>=1.3", "fakeredis>=2.20"]  # a2a-sdk: end-to-end A2A tests only

[project.scripts]
aof = "aof.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: talks to real services (Redis, an IdP, the Claude API); see tests/live/README.md"]
